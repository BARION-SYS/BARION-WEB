# Construir y publicar la imagen de producción de BARION-WEB (el sitio de venta).
#
# Despliegue propio y ciclo propio, que es el motivo de que este repositorio
# exista: un precio nuevo no debería obligar a redesplegar el panel.
#
# ── Esta imagen tampoco es genérica ─────────────────────────────────────────
# El sitio se **prerrenderiza con los precios dentro**, así que el build
# necesita saber dónde está la api (`API_URL`, sin prefijo público: la resuelve
# el servidor de Next, no el navegador) y con qué dominio se publica. Los dos
# `NEXT_PUBLIC_*` se hornean en el bundle.
#
# `NEXT_PUBLIC_SITE_URL` es la que decide qué se publica de lo estructurado: sin
# ella el sitio se sirve entero pero **sin JSON-LD, sin sitemap y sin mapa en el
# robots.txt**, o sea invisible para lo que hace que se encuentre. Por eso se
# exige aquí aunque el código la trate como opcional: opcional para arrancar no
# es opcional para publicar.
#
# Salen de variables del repositorio (Settings → Secrets and variables →
# Actions → Variables).
#
# `IMAGE_LANDING=ghcr.io/<org>/barion-web:sha-<commit>` en el `.env` del padre.
name: Publicar imagen

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publicar-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGEN: ${{ github.repository_owner }}/barion-web

jobs:
  publicar:
    name: Construir y publicar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Comprobar las direcciones ANTES de construir
        run: |
          set -euo pipefail
          : "${API:?Falta la variable de repositorio API_URL}"
          : "${APP:?Falta la variable de repositorio NEXT_PUBLIC_APP_URL}"
          : "${SITIO:?Falta la variable de repositorio NEXT_PUBLIC_SITE_URL}"
        env:
          API: ${{ vars.API_URL }}
          APP: ${{ vars.NEXT_PUBLIC_APP_URL }}
          SITIO: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar al registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGEN }}
          tags: |
            type=sha,prefix=sha-,format=long
            type=ref,event=branch
            type=semver,pattern=v{{version}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
